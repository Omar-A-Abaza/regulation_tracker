# No [theme] section on purpose: setting a custom color locks Streamlit into light
# mode. Without it, the dashboard follows the computer's light/dark setting.

[client]
# Hide developer buttons like "Deploy"; viewers only see the app.
toolbarMode = "viewer"

[server]
# Only this computer can open the dashboard. Change when we put it on a server.
address = "localhost"

[browser]
gatherUsageStats = false
