# No [theme] section on purpose: setting a custom color locks Streamlit into light
# mode. Without it, the dashboard follows the computer's light/dark setting.

[client]
# Hide developer buttons like "Deploy"; viewers only see the app.
toolbarMode = "viewer"

# No [server] address on purpose: "localhost" would block Streamlit Community Cloud.
# For a local-only run use: streamlit run dashboard/app.py --server.address localhost

[browser]
gatherUsageStats = false
